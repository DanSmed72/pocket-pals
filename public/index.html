<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pocket Pals">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#7c4dff">
<title>Pocket Pals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b2350;--bg:#fff4dc;--p:#7c4dff;--pink:#ff5fa2;--yel:#ffd23f;--teal:#2ec4b6;--org:#ff8c42;--blue:#4cc9f0;--green:#4cd964;--r:22px;--kc:#7c4dff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);font-family:'Fredoka',ui-rounded,'SF Pro Rounded',system-ui,sans-serif;color:var(--ink);-webkit-text-size-adjust:100%;overscroll-behavior:none;touch-action:manipulation}
body.noscroll .scroll{overflow:hidden}
button{font-family:inherit;color:inherit}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto;background-color:var(--bg);background-image:radial-gradient(rgba(124,77,255,.13) 2.5px,transparent 3px);background-size:26px 26px;overflow:hidden}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 28px}
.scroll.pt{padding-top:calc(16px + env(safe-area-inset-top))}
h1,h2,h3{margin:0}
.hint,.sub{font-size:14px;opacity:.7;font-weight:500}
.err{color:#d6204f;font-weight:600;min-height:22px;font-size:15px;margin:6px 0}

/* cards & buttons */
.card{background:#fff;border:3px solid var(--ink);border-radius:var(--r);box-shadow:0 5px 0 var(--ink);padding:14px;margin:0 0 18px}
.card h3{font-size:20px;margin-bottom:8px}
.btn{font-weight:600;font-size:17px;border:3px solid var(--ink);background:var(--yel);border-radius:16px;padding:11px 16px;box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s;cursor:pointer;line-height:1.1}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.btn.go{background:var(--green)}.btn.pink{background:var(--pink);color:#fff}.btn.purple{background:var(--p);color:#fff}.btn.ghost{background:#fff}.btn.danger{background:#ff6b6b;color:#fff}
.btn.sm{font-size:15px;padding:8px 12px;border-radius:13px;box-shadow:0 3px 0 var(--ink)}
.btn.block{display:block;width:100%;margin-top:10px}
.btn.big{font-size:21px;padding:15px}
.btn[disabled]{opacity:.45;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border:2px solid var(--ink);border-radius:99px;font-weight:600;font-size:14px;background:#fff;white-space:nowrap}
.pill.money{background:#c9f7c3}.pill.time{background:#cdeeff}.pill.neg{background:#ffd3d9}.pill.warn{background:#ffe9a6}
.bar{height:20px;border:3px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--c,var(--teal));border-right:3px solid var(--ink);border-radius:99px;transition:width .8s cubic-bezier(.2,1.4,.4,1);min-width:0}
.bar i[style*="width:0%"]{border-right:0}

/* headers */
.khead{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 14px 14px;background:var(--kc);border-bottom:3px solid var(--ink);color:#fff;flex-wrap:wrap}
.kme{display:flex;align-items:center;gap:12px;flex:1;min-width:0;order:2;width:100%}
.hbtn{font-weight:600;font-size:14px;background:rgba(255,255,255,.9);color:var(--ink);border:2.5px solid var(--ink);border-radius:99px;padding:5px 12px;order:1;box-shadow:0 2px 0 var(--ink)}
.flame{order:1;margin-left:auto;background:#fff;color:var(--ink);border:2.5px solid var(--ink);border-radius:99px;padding:4px 12px;font-weight:700;font-size:16px;box-shadow:0 2px 0 var(--ink)}
.flame.off{opacity:.6;filter:grayscale(1)}
.bigav{width:68px;height:68px;border-radius:50%;background:#fff;border:3px solid var(--ink);display:grid;place-items:center;font-size:40px;animation:bob 2.4s ease-in-out infinite;box-shadow:0 4px 0 var(--ink)}
.hi{font-size:28px;font-weight:700;line-height:1.05;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.kme .sub{color:#fff;opacity:.95}
.phead{background:var(--ink);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 14px;display:flex;align-items:center;gap:10px}
.phead h1{font-size:26px;flex:1}
.phead .hbtn{order:0}

/* tabs */
.tabbar{display:flex;background:#fff;border-top:3px solid var(--ink);padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:4px}
.tab{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:0;font-size:12px;font-weight:600;padding:5px 0;border-radius:16px;opacity:.65}
.tab span{font-size:24px;line-height:1.15;transition:transform .2s}
.tab.on{background:var(--yel);opacity:1;box-shadow:inset 0 0 0 2.5px var(--ink)}
.tab.on span{animation:pop .4s}
.dot{position:relative}.dot::after{content:'';position:absolute;top:2px;right:calc(50% - 22px);width:11px;height:11px;border-radius:50%;background:#ff3b6b;border:2px solid #fff}

/* picker */
.pick{text-align:center}
.logo{font-size:84px;animation:bob 2.2s ease-in-out infinite;display:inline-block}
.pick h1,.welcome h1{font-size:46px;color:var(--p);text-shadow:0 4px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink);letter-spacing:1px;margin:2px 0 4px}
.tag{font-weight:500;margin:0 0 18px;opacity:.8}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:8px}
.tile{border:3px solid var(--ink);border-radius:26px;background:var(--kc);box-shadow:0 6px 0 var(--ink);padding:18px 8px 14px;color:#fff;font-size:22px;font-weight:700;transition:transform .08s,box-shadow .08s;cursor:pointer}
.tile:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.tile .av{width:84px;height:84px;margin:0 auto 8px;border-radius:50%;background:#fff;border:3px solid var(--ink);display:grid;place-items:center;font-size:50px}
.tile.parent{background:var(--ink);grid-column:1/-1}
.tile.parent .av{width:60px;height:60px;font-size:34px;background:var(--yel)}
.tile:nth-child(odd) .av{animation:bob 2.6s ease-in-out infinite}.tile:nth-child(even) .av{animation:bob 2.9s .3s ease-in-out infinite}

.welcome{text-align:center}.welcome .card{text-align:left}
.pininput,input[type=text],input[type=number],input:not([type]),input[type=password],select{width:100%;font:inherit;font-size:18px;font-weight:500;padding:11px 14px;border:3px solid var(--ink);border-radius:14px;background:#fffdf5;color:var(--ink);outline:none}
input:focus{box-shadow:0 0 0 4px rgba(124,77,255,.35)}
.pininput{letter-spacing:10px;text-align:center;font-size:24px}
.krow{margin-bottom:12px}.krow input{margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:17px;font-weight:600;border:2.5px solid var(--ink);border-radius:14px;background:#fff;padding:6px 11px;box-shadow:0 3px 0 var(--ink);transition:transform .08s}
.chip.on{background:var(--yel);transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.chip.sw{width:38px;height:38px;border-radius:50%;padding:0}
.chip.sw.on{outline:3px solid var(--ink);outline-offset:2px}
.fld{display:block;margin:0 0 14px}.fld>span{display:block;font-weight:600;margin-bottom:5px;font-size:15px}

/* jar */
.jarcard{text-align:center;background:linear-gradient(#fff,#f2ecff)}
.jarwrap{width:170px;margin:0 auto;position:relative}
.jar{width:100%;display:block;overflow:visible}
.jar .wave{animation:wave 2.4s linear infinite}
.jar .bub{animation:rise 3.2s ease-in infinite;opacity:0}
.jar .bub:nth-of-type(2){animation-delay:1s}.jar .bub:nth-of-type(3){animation-delay:2s}
.jar .coinf{animation:bob 2s ease-in-out infinite}
.balance{font-size:54px;font-weight:700;line-height:1;margin-top:2px;text-shadow:0 3px 0 rgba(43,35,80,.18)}
.balsub{font-weight:500;opacity:.7;margin-bottom:12px}
.goalrow{display:flex;align-items:center;gap:10px;text-align:left;margin-bottom:8px}
.gemo{font-size:34px}.goalrow b{font-size:19px;display:block;line-height:1.1}.goalrow .pill{margin-left:auto}
.gtxt{font-weight:600;margin-top:8px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
.stat{margin:0;text-align:center;padding:12px 8px}
.stat .ico{font-size:30px}.stat .val{font-size:26px;font-weight:700;line-height:1.1}.stat .sub{font-size:13px}
.stat.clickable{cursor:pointer}

/* quests */
.q{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:2.5px dashed rgba(43,35,80,.18);cursor:pointer}
.q:last-child{border-bottom:0}
.chk{flex:none;width:40px;height:40px;border-radius:13px;border:3px solid var(--ink);background:#fff;display:grid;place-items:center;font-size:24px;box-shadow:0 3px 0 var(--ink);transition:background .15s}
.q.ok .chk{background:var(--green)}.q.wait .chk{background:var(--yel)}
.q.ok .chk::after{content:'✓';font-weight:700;animation:pop .4s}.q.wait .chk::after{content:'⏳';font-size:20px}
.qe{font-size:28px}.qt{font-weight:600;font-size:18px;flex:1;line-height:1.1}
.q.ok .qt{text-decoration:line-through;opacity:.55}
.lockbanner{background:#ffe9a6;border:3px dashed var(--ink);border-radius:16px;padding:10px 12px;font-weight:600;margin-bottom:12px;display:flex;gap:10px;align-items:center}
.lockbanner .big{font-size:32px}
.unlockbanner{background:#c9f7c3;border:3px solid var(--ink);border-radius:16px;padding:10px 12px;font-weight:600;margin-bottom:12px;display:flex;gap:10px;align-items:center}
.locked{filter:grayscale(.85);opacity:.5;pointer-events:none}
.job{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:2.5px dashed rgba(43,35,80,.18)}
.job:last-child{border-bottom:0}
.job .jm{flex:1;min-width:0}.job .jt{font-weight:600;font-size:18px;line-height:1.1}.job .pills{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
.job.done{opacity:.6}
.sec{font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;opacity:.65;margin:6px 4px 8px}

/* rows */
.row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:2.5px dashed rgba(43,35,80,.18);cursor:pointer}
.row:last-child{border-bottom:0}
.remo{font-size:28px;flex:none;width:36px;text-align:center}.rmain{flex:1;min-width:0}.rmain b{font-size:17px;line-height:1.1;display:block}.chev{font-size:24px;opacity:.4}
.row .amt{font-weight:700;font-size:17px}.amt.pos{color:#1c9a3c}.amt.neg{color:#d6204f}
.empty{text-align:center;padding:18px 8px;font-weight:500;opacity:.75}
.empty .e{font-size:44px;display:block}

/* parent kid cards */
.kidcard{cursor:pointer}
.kc-top{display:flex;align-items:center;gap:12px}
.kc-top .av{width:54px;height:54px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;font-size:32px;background:var(--kc)}
.kc-top b{font-size:21px;display:block;line-height:1.1}.kbal{margin-left:auto;font-size:28px;font-weight:700}
.kc-row{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.approve{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:2.5px dashed rgba(43,35,80,.18)}
.approve:last-child{border-bottom:0}
.approve .btn{padding:8px 11px}
.walletbig{text-align:center}
.walletbig .balance{font-size:50px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.acts .btn{font-size:16px;padding:12px 6px}
.kselect{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 14px;margin:0 -2px}
.kselect .chip{flex:none;font-size:18px}
.toggle{display:flex;align-items:center;gap:12px}
.sw-btn{flex:none;width:58px;height:34px;border-radius:99px;border:3px solid var(--ink);background:#ddd;position:relative;transition:background .2s}
.sw-btn::after{content:'';position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;border:2.5px solid var(--ink);transition:transform .2s}
.sw-btn.on{background:var(--green)}.sw-btn.on::after{transform:translateX(24px)}

/* sheet */
#sheet .backdrop{position:fixed;inset:0;background:rgba(43,35,80,.55);animation:fade .2s;z-index:50}
#sheet .sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:#fffdf5;border:3px solid var(--ink);border-bottom:0;border-radius:28px 28px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));max-height:92dvh;overflow-y:auto;z-index:51;animation:up .28s cubic-bezier(.2,1.2,.4,1);-webkit-overflow-scrolling:touch}
.grab{width:52px;height:6px;border-radius:9px;background:var(--ink);opacity:.25;margin:0 auto 10px}
.sheet h2{font-size:24px;margin-bottom:12px}
.dots{display:flex;gap:14px;justify-content:center;margin:6px 0 16px}
.dots i{width:20px;height:20px;border-radius:50%;border:3px solid var(--ink);background:#fff;transition:background .1s,transform .1s}
.dots i.on{background:var(--p);transform:scale(1.15)}
.dots.shake{animation:shake .4s}
.pad{display:grid;grid-template-columns:repeat(3,74px);gap:12px;justify-content:center}
.key{width:74px;height:74px;border-radius:50%;border:3px solid var(--ink);background:#fff;font-size:30px;font-weight:600;box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.key:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink);background:var(--yel)}
.toast{position:fixed;bottom:calc(92px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:600;padding:12px 18px;border-radius:99px;z-index:99;animation:toast 2.6s forwards;max-width:90vw;text-align:center;border:3px solid #fff;box-shadow:0 5px 0 rgba(0,0,0,.25)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:98;width:100%;height:100%}

@keyframes bob{50%{transform:translateY(-6px) rotate(-2deg)}}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes wave{to{transform:translateX(-100px)}}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-70px);opacity:0}}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
@keyframes toast{0%{opacity:0;transform:translate(-50%,30px) scale(.8)}10%{opacity:1;transform:translate(-50%,0) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,10px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"></div>
<canvas id="fx"></canvas>
<script>
/* ================= helpers ================= */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const pad2=n=>String(n).padStart(2,'0');
const dkey=(d=new Date())=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const today=()=>dkey();
const parseKey=k=>new Date(+k.slice(0,4),+k.slice(5,7)-1,+k.slice(8,10));
const weekKey=(d=new Date())=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return dkey(x)};
const money=c=>{c=Math.round(c||0);const a=Math.abs(c);const s=(a%100===0)?String(a/100):(a/100).toFixed(2);return(c<0?'-':'')+'$'+s};
const parseMoney=s=>{const n=parseFloat(String(s).replace(/[^0-9.]/g,''));return isFinite(n)?Math.round(n*100):0};
const fmtMins=m=>{m=Math.round(m||0);const a=Math.abs(m),h=Math.floor(a/60),r=a%60;const t=h?(h+'h'+(r?' '+r+'m':'')):(r+' min');return(m<0?'-':'')+t};
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtDate=ts=>{const d=new Date(ts);const k=dkey(d);if(k===today())return'Today';const y=new Date();y.setDate(y.getDate()-1);if(k===dkey(y))return'Yesterday';return d.getDate()+' '+MONTHS[d.getMonth()]};
const AV=['🦊','🐼','🐯','🐸','🦄','🐙','🐲','🦖','🐵','🐱','🐶','🦁','🐰','🐨','🚀','⚽'];
const COLORS=['#7c4dff','#ff5fa2','#2ec4b6','#ff8c42','#4cc9f0','#8ac926'];
const JOBEMO=['🧹','🍽️','🐕','🚗','🌱','🧺','🗑️','📚','🛏️','🍳','🧽','🪟','🛒','🧸','🪥','🐈'];
const GOALEMO=['🎮','🚲','🧸','🏖️','✈️','🎢','👟','📱','🎧','🎨','🏕️','🍦'];

/* ================= state ================= */
const KEY='pocketpals.v1';
const emptyState=()=>({v:1,updated:0,pin:'',settings:{approveDaily:false},kids:[],daily:[],log:{},jobs:[],goals:[],ledger:[]});
let S=(()=>{try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&o.kids)return o}}catch(e){}return emptyState()})();
const ui={who:null,fromParent:false,ptab:'home',ktab:'me',moneyKid:null};
let syncState='local';

function persist(){
  S.updated=Date.now();
  const keys=Object.keys(S.log).sort();while(keys.length>90)delete S.log[keys.shift()];
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  syncPush();
}

/* ---- family sync via Netlify Function (optional; falls back to this device only) ---- */
const CODE_KEY='pocketpals.code',API='/.netlify/functions/sync';
let famCode=(()=>{try{return localStorage.getItem(CODE_KEY)||''}catch(e){return''}})();
const newCode=()=>Array.from({length:12},()=>'abcdefghjkmnpqrstuvwxyz23456789'[Math.random()*31|0]).join('');
const cleanCode=c=>String(c||'').toLowerCase().replace(/[^a-z0-9]/g,'');
function setCode(c){famCode=c;try{localStorage.setItem(CODE_KEY,c)}catch(e){}}
let pushTimer=null,lastPushed=0,pulling=false;
async function syncPull(){
  if(!famCode||pulling)return;pulling=true;
  try{
    const r=await fetch(API+'?code='+encodeURIComponent(famCode),{cache:'no-store'});
    if(!r.ok)throw new Error('x');
    const d=await r.json();syncState='synced';
    if(d&&d.json){
      let o;try{o=JSON.parse(d.json)}catch(e){o=null}
      if(o&&o.kids){
        if(o.updated>S.updated){
          S=o;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
          if(ui.who&&ui.who!=='parent'&&!kidById(ui.who))ui.who=null;
          if(!$('#sheet').innerHTML)render();
        }else if(o.updated<S.updated)syncPush(true);
      }
    }else if(S.kids.length)syncPush(true);
  }catch(e){syncState='offline'}
  pulling=false;
}
function syncPush(now){
  if(!famCode)return;
  clearTimeout(pushTimer);
  pushTimer=setTimeout(async()=>{
    try{
      lastPushed=S.updated;
      const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code:famCode,json:JSON.stringify(S),updated:S.updated})});
      syncState=r.ok?'synced':'offline';
    }catch(e){syncState='offline'}
  },now?0:500);
}
function initSync(){
  syncPull();
  setInterval(()=>{if(!document.hidden&&!$('#sheet').innerHTML)syncPull()},8000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncPull()});
}

/* ================= selectors ================= */
const kidById=id=>S.kids.find(k=>k.id===id);
const balance=id=>S.ledger.reduce((a,e)=>e.kidId===id?a+(e.amount||0):a,0);
const screenMins=id=>S.ledger.reduce((a,e)=>e.kidId===id?a+(e.mins||0):a,0);
const goalsOf=id=>S.goals.filter(g=>g.kidId===id);
function activeGoal(id){const k=kidById(id);return S.goals.find(g=>g.id===k.goalId&&!g.doneOn&&g.kidId===id)||goalsOf(id).find(g=>!g.doneOn)||null}
const dailiesFor=id=>S.daily.filter(d=>!d.kids||!d.kids.length||d.kids.includes(id));
const dstat=(id,j,key=today())=>((S.log[key]||{})[id]||{})[j];
const isDone=(st)=>st==='ok'||(st==='done'&&!S.settings.approveDaily);
function dcounts(id,key=today()){const l=dailiesFor(id);let ok=0,wait=0;l.forEach(j=>{const s=dstat(id,j.id,key);if(isDone(s))ok++;else if(s==='done')wait++});return{total:l.length,ok,wait}}
const unlocked=id=>{const c=dcounts(id);return c.total===0||c.ok===c.total};
function streak(id){
  const list=dailiesFor(id);if(!list.length)return 0;
  const okDay=k=>list.every(j=>isDone(dstat(id,j.id,k)));
  let n=0;const d=new Date();
  if(okDay(dkey(d)))n++;
  d.setDate(d.getDate()-1);
  while(n<400&&okDay(dkey(d))){n++;d.setDate(d.getDate()-1)}
  return n;
}
function jstatus(j){
  if(j.status==='approved'){
    if(j.repeat==='daily'&&j.approvedOn!==today())return'open';
    if(j.repeat==='weekly'&&weekKey(parseKey(j.approvedOn))!==weekKey())return'open';
  }
  return j.status;
}
const repLabel=r=>r==='daily'?'🔁 Daily':r==='weekly'?'🔁 Weekly':'☝️ Once';
function pendingList(){
  const out=[];
  S.jobs.forEach(j=>{if(j.status==='pending'&&kidById(j.kidId))out.push({t:'job',j,k:kidById(j.kidId)})});
  if(S.settings.approveDaily){
    S.kids.forEach(k=>dailiesFor(k.id).forEach(d=>{if(dstat(k.id,d.id)==='done')out.push({t:'daily',d,k})}));
  }
  return out;
}

function checkGoal(kidId,celebrate){
  const g=activeGoal(kidId);if(!g)return;
  const reached=balance(kidId)>=g.target;
  if(reached&&!g.hit){g.hit=true;if(celebrate){confetti(160);toast('🎉 '+kidById(kidId).name+' has enough for '+g.title+'!')}}
  if(!reached)g.hit=false;
}

/* confetti */
function confetti(n=100){
  const c=$('#fx'),dpr=window.devicePixelRatio||1;
  c.width=innerWidth*dpr;c.height=innerHeight*dpr;
  const x=c.getContext('2d');x.scale(dpr,dpr);
  const cols=['#ff5fa2','#ffd23f','#2ec4b6','#7c4dff','#ff8c42','#4cc9f0','#4cd964'];
  const ps=Array.from({length:n},()=>({x:innerWidth/2+(Math.random()-.5)*80,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,s:6+Math.random()*7,c:cols[Math.random()*cols.length|0],r:Math.random()*6,vr:(Math.random()-.5)*.4}));
  let f=0;
  (function tick(){
    x.clearRect(0,0,innerWidth,innerHeight);
    ps.forEach(p=>{p.vy+=.4;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);x.restore()});
    if(++f<110)requestAnimationFrame(tick);else x.clearRect(0,0,innerWidth,innerHeight);
  })();
}

function jarSvg(pct,color){
  const top=62,bottom=216;
  const p=Math.max(.07,Math.min(1,pct));
  const lv=Math.round(bottom-(bottom-top)*p);
  const wavePath='M0 8 q25 -12 50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 V200 H0Z';
  return`<svg viewBox="0 0 200 240" class="jar" aria-hidden="true">
  <defs><clipPath id="jc"><path d="M52 62 Q52 54 62 54 H138 Q148 54 148 62 V194 Q148 224 118 224 H82 Q52 224 52 194 Z"/></clipPath></defs>
  <path d="M52 62 Q52 54 62 54 H138 Q148 54 148 62 V194 Q148 224 118 224 H82 Q52 224 52 194 Z" fill="#fff" opacity=".75"/>
  <g clip-path="url(#jc)">
    <g transform="translate(30 ${lv-8})"><g class="wave"><path d="${wavePath}" fill="${color}"/></g></g>
    <circle class="bub" cx="80" cy="205" r="5" fill="#fff" opacity=".7"/><circle class="bub" cx="115" cy="210" r="4" fill="#fff" opacity=".7"/><circle class="bub" cx="98" cy="208" r="6" fill="#fff" opacity=".7"/>
    <path d="M62 70 V180" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".55"/>
  </g>
  <path d="M52 62 Q52 54 62 54 H138 Q148 54 148 62 V194 Q148 224 118 224 H82 Q52 224 52 194 Z" fill="none" stroke="#2b2350" stroke-width="5"/>
  <rect x="62" y="34" width="76" height="22" rx="9" fill="#ffd23f" stroke="#2b2350" stroke-width="5"/>
  <text class="coinf" x="100" y="26" text-anchor="middle" font-size="30">🪙</text>
  <text x="100" y="${Math.min(190,Math.max(108,lv+34))}" text-anchor="middle" font-size="26" font-weight="700" fill="#2b2350" font-family="Fredoka,system-ui">${Math.round(Math.min(1,pct)*100)}%</text>
  </svg>`;
}

function render(){
  const app=$('#app');
  const old=$('.scroll');const keyNow=ui.who+'|'+ui.ptab+'|'+ui.ktab+'|'+ui.moneyKid;
  const top=old&&render.last===keyNow?old.scrollTop:0;
  let html;
  if(!S.kids.length)html=viewWelcome();
  else if(ui.who===null)html=viewPicker();
  else if(ui.who==='parent')html=viewParent();
  else if(kidById(ui.who))html=viewKid(kidById(ui.who));
  else{ui.who=null;html=viewPicker()}
  app.innerHTML=html;
  render.last=keyNow;
  const sc=$('.scroll');if(sc&&top)sc.scrollTop=top;
}

/* ================= actions ================= */
const A={
  closeSheet(){closeSheet()},
  confirmYes(){const f=confirmFn;confirmFn=null;closeSheet();if(f)f()},
  addRow(){const n=document.querySelectorAll('.krow').length;$('#krows').insertAdjacentHTML('beforeend',kidRow(n))},
  finishSetup(){
    const pin=$('#spin').value.trim();
    const rows=[...document.querySelectorAll('.krow')];
    const kids=rows.map((r,i)=>({id:uid(),name:$('input',r).value.trim(),avatar:getChip('av'+i)||AV[i%AV.length],color:COLORS[i%COLORS.length]})).filter(k=>k.name);
    if(!/^\d{4}$/.test(pin))return $('#werr').textContent='Pick a 4-digit PIN for the parent area.';
    if(!kids.length)return $('#werr').textContent='Add at least one kid.';
    S=emptyState();S.pin=pin;S.kids=kids;if(!famCode)setCode(newCode());
    S.daily=[{id:uid(),title:'Make your bed',emoji:'🛏️',kids:[]},{id:uid(),title:'Brush teeth',emoji:'🪥',kids:[]},{id:uid(),title:'Tidy your room',emoji:'🧸',kids:[]}];
    persist();ui.who=null;render();toast('Welcome! Tap Parent to add jobs 👑');
  },
  demo(){loadDemo();ui.who=null;render();toast('Demo family loaded — PIN is 1234');},
  pickKid(d){ui.who=d.id;ui.fromParent=false;ui.ktab='me';render();const k=kidById(d.id);if(k)checkGoal(k.id,false)},
  pickParent(){sheetPad()},
  padKey(d){if(padBuf.length>=4)return;padBuf+=d.k;padUpdate();
    if(padBuf.length===4){
      if(padBuf===S.pin){closeSheet();ui.who='parent';ui.fromParent=false;ui.ptab='home';render()}
      else{const el=$('#dots');el.classList.add('shake');$('#perr').textContent='Oops, wrong PIN';setTimeout(()=>{padBuf='';padUpdate();el.classList.remove('shake');},450)}
    }},
  padDel(){padBuf=padBuf.slice(0,-1);padUpdate()},
  switchUser(){ui.who=null;render()},
  lock(){ui.who=null;ui.fromParent=false;render()},
  toParent(){ui.who='parent';ui.fromParent=false;render()},
  viewKid(d){ui.who=d.id;ui.fromParent=true;ui.ktab='me';render()},
  ktab(d){ui.ktab=d.t;render()},ktabTo(d){ui.ktab=d.t;render()},
  ptab(d){ui.ptab=d.t;render()},
  toggleDaily(d){
    const kid=ui.who,wasOpen=unlocked(kid);
    const key=today();S.log[key]=S.log[key]||{};const l=S.log[key][kid]=S.log[key][kid]||{};
    const cur=l[d.id];
    if(cur==='ok'&&S.settings.approveDaily&&!ui.fromParent){toast('A parent has checked this one ✅');return}
    if(cur)delete l[d.id];else l[d.id]=(S.settings.approveDaily&&!ui.fromParent)?'done':'ok';
    persist();render();
    if(!wasOpen&&unlocked(kid)){confetti(130);toast('🔓 Paid jobs unlocked!')}
    else if(!cur&&S.settings.approveDaily&&!ui.fromParent)toast('Sent to a parent to check ⏳');
    else if(!cur)toast('Nice one! ⭐');
  },
  claimJob(d){
    const j=S.jobs.find(x=>x.id===d.id);if(!j||!unlocked(j.kidId))return;
    j.status='pending';j.doneOn=today();persist();render();toast('Sent to a parent to check ⏳');
  },
  approveJob(d){
    const j=S.jobs.find(x=>x.id===d.id);if(!j)return;
    j.status='approved';j.approvedOn=today();
    addEntry({kidId:j.kidId,type:'earn',amount:j.pay||0,mins:j.mins||0,note:j.title});
    persist();render();confetti(70);toast('Approved! '+(j.pay?money(j.pay):'')+(j.mins?' +'+fmtMins(j.mins):'')+' added ⭐');
  },
  redoJob(d){const j=S.jobs.find(x=>x.id===d.id);if(!j)return;j.status='open';persist();render();toast('Sent back to try again')},
  approveDaily(d){const key=today();((S.log[key]||{})[d.kid]||{})[d.id]='ok';persist();render();toast('Quest approved ✅')},
  redoDaily(d){const key=today();delete ((S.log[key]||{})[d.kid]||{})[d.id];persist();render()},
  /* goals */
  newGoal(){sheetGoal(ui.who)},
  editGoal(d){const g=S.goals.find(x=>x.id===d.id);if(g)sheetGoal(g.kidId,g)},
  setGoal(d){const g=S.goals.find(x=>x.id===d.id);if(!g)return;kidById(g.kidId).goalId=g.id;checkGoal(g.kidId,true);persist();render()},
  saveGoal(d){
    const title=val('title'),target=parseMoney(val('target')),emoji=getChip('gemo')||'🎯',kind=getChip('kind')||'thing';
    if(!title)return setErr('What are you saving for?');
    if(target<=0)return setErr('How much does it cost?');
    let g;
    if(d.id){g=S.goals.find(x=>x.id===d.id);Object.assign(g,{title,target,emoji,kind});}
    else{g={id:uid(),kidId:d.kid,title,target,emoji,kind};S.goals.push(g);if(!activeGoal(d.kid)||!goalsOf(d.kid).some(x=>!x.doneOn&&x.id!==g.id))kidById(d.kid).goalId=g.id}
    g.hit=false;checkGoal(d.kid,true);persist();closeSheet();render();
  },
  delGoal(d){confirmSheet('Delete this goal?','The money stays in the account.','Delete',()=>{S.goals=S.goals.filter(g=>g.id!==d.id);persist();render()})},
  /* parent: jobs */
  newDaily(){sheetDaily()},editDaily(d){sheetDaily(S.daily.find(x=>x.id===d.id))},
  saveDaily(d){
    const title=val('title');if(!title)return setErr('Give the quest a name.');
    const emoji=getChip('emo')||'⭐',kids=getChip('kids',true);
    if(d.id){Object.assign(S.daily.find(x=>x.id===d.id),{title,emoji,kids})}else S.daily.push({id:uid(),title,emoji,kids});
    persist();closeSheet();render();
  },
  delDaily(d){confirmSheet('Delete this quest?','It will disappear for everyone.','Delete',()=>{S.daily=S.daily.filter(x=>x.id!==d.id);persist();render()})},
  newJob(){sheetJob(null,null)},editJob(d){const j=S.jobs.find(x=>x.id===d.id);const s=jstatus(j);
    if(s==='pending'){openSheet('⏳ Waiting for approval',`<p style="font-weight:600;margin:0 0 10px">${j.emoji} ${esc(j.title)}</p><button class="btn go block" data-act="approveJobClose" data-id="${j.id}">✓ Approve &amp; pay</button><button class="btn ghost block" data-act="editJobForce" data-id="${j.id}">✏️ Edit job</button>`)}
    else sheetJob(j)},
  approveJobClose(d){closeSheet();A.approveJob(d)},
  editJobForce(d){sheetJob(S.jobs.find(x=>x.id===d.id))},
  saveJob(d){
    const title=val('title'),emoji=getChip('emo')||'🧹',pay=parseMoney(val('pay')),mins=Math.max(0,parseInt(val('mins'))||0),repeat=getChip('rep')||'once';
    const kids=d.id?[getChip('kids')]:getChip('kids',true);
    if(!title)return setErr('Give the job a name.');
    if(!kids.length||!kids[0])return setErr('Pick who it is for.');
    if(!pay&&!mins)return setErr('Add some pay or screen time.');
    if(d.id){Object.assign(S.jobs.find(x=>x.id===d.id),{title,emoji,pay,mins,repeat,kidId:kids[0]})}
    else kids.forEach(kid=>S.jobs.push({id:uid(),kidId:kid,title,emoji,pay,mins,repeat,status:'open',createdOn:today()}));
    persist();closeSheet();render();toast('Job saved ✅');
  },
  delJob(d){confirmSheet('Delete this job?','Money already paid stays in the history.','Delete',()=>{S.jobs=S.jobs.filter(x=>x.id!==d.id);persist();render()})},
  /* money */
  moneyKid(d){ui.moneyKid=d.id;render()},
  quickMoney(d){ui.moneyKid=d.id;ui.ptab='money';render()},
  withdraw(d){sheetWithdraw(d.id)},deposit(d){sheetDeposit(d.id)},screenUse(d){sheetScreen(d.id,true)},screenAdd(d){sheetScreen(d.id,false)},
  doWithdraw(d){
    const c=parseMoney(val('amt'));if(c<=0)return setErr('Enter how much.');
    if(c>balance(d.id))return setErr('Only '+money(balance(d.id))+' in the account.');
    const why=getChip('why')||'Money out',note=val('note'),gid=getChip('goal');
    addEntry({kidId:d.id,type:'withdraw',amount:-c,note:why+(note?': '+note:'')});
    if(gid){const g=S.goals.find(x=>x.id===gid);if(g){g.doneOn=Date.now();g.spent=c;g.hit=false;const k=kidById(d.id);if(k.goalId===g.id)k.goalId=null;confetti(150);toast('🏆 '+g.title+' goal complete!')}}
    persist();closeSheet();render();if(!gid)toast(money(c)+' taken out 💸');
  },
  doDeposit(d){
    const c=parseMoney(val('amt'));if(c<=0)return setErr('Enter how much.');
    const why=getChip('why')||'Money in',note=val('note');
    addEntry({kidId:d.id,type:'deposit',amount:c,note:why+(note?': '+note:'')});
    persist();closeSheet();render();toast(money(c)+' added 🎁');
  },
  doScreen(d){
    const m=parseInt(val('mins'))||0;if(m<=0)return setErr('Enter the minutes.');
    const use=d.use==='1',note=val('note');
    if(use&&m>screenMins(d.id))return setErr('Only '+fmtMins(screenMins(d.id))+' in the bank.');
    addEntry({kidId:d.id,type:use?'screen-use':'screen-add',mins:use?-m:m,note:note||(use?'Screen time used':'Screen time added')});
    persist();closeSheet();render();toast(use?'📺 '+fmtMins(m)+' used':'⏱️ '+fmtMins(m)+' added');
  },
  entry(d){const e=S.ledger.find(x=>x.id===d.id);if(e)sheetEntry(e)},
  delEntry(d){S.ledger=S.ledger.filter(x=>x.id!==d.id);S.kids.forEach(k=>checkGoal(k.id,false));persist();closeSheet();render();toast('Entry deleted')},
  /* settings */
  toggleApprove(){S.settings.approveDaily=!S.settings.approveDaily;persist();render()},
  changePin(){sheetPin()},
  savePin(){const p=val('pin');if(!/^\d{4}$/.test(p))return setErr('PIN must be 4 digits.');S.pin=p;persist();closeSheet();toast('PIN changed 🔐')},
  newKid(){sheetKid()},editKid(d){sheetKid(kidById(d.id))},
  saveKid(d){
    const name=val('name');if(!name)return setErr('Enter a name.');
    const avatar=getChip('av')||AV[0],color=getChip('col')||COLORS[0];
    if(d.id)Object.assign(kidById(d.id),{name,avatar,color});else S.kids.push({id:uid(),name,avatar,color});
    persist();closeSheet();render();
  },
  delKid(d){const k=kidById(d.id);confirmSheet('Remove '+esc(k.name)+'?','All their jobs, goals and money history will be deleted.','Remove',()=>{
    S.kids=S.kids.filter(x=>x.id!==d.id);S.jobs=S.jobs.filter(x=>x.kidId!==d.id);S.goals=S.goals.filter(x=>x.kidId!==d.id);S.ledger=S.ledger.filter(x=>x.kidId!==d.id);S.daily.forEach(x=>{x.kids=(x.kids||[]).filter(i=>i!==d.id)});
    if(ui.moneyKid===d.id)ui.moneyKid=null;
    if(!S.kids.length){ui.who=null}
    persist();render()})},
  joinCode(){sheetCode()},
  async saveCode(){
    const c=cleanCode(val('code'));if(c.length<8)return setErr('That code looks too short.');
    setErr('Connecting…');
    try{
      const r=await fetch(API+'?code='+encodeURIComponent(c),{cache:'no-store'});
      if(!r.ok)throw new Error('x');
      const d=await r.json();
      if(!d||!d.json){
        if(S.kids.length){setCode(c);closeSheet();syncPush(true);render();toast('Connected ☁️');return}
        return setErr('No family found with that code.');
      }
      const o=JSON.parse(d.json);setCode(c);S=o;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
      syncState='synced';ui.who=null;closeSheet();render();toast('Connected! ☁️');
    }catch(e){setErr('Could not connect. Check the code and your internet.')}
  },
  resetAll(){confirmSheet('Erase everything?','This deletes all kids, jobs, goals and money records on every device. It cannot be undone.','Yes, erase it all',()=>{S=emptyState();ui.who=null;persist();render()})}
};

document.addEventListener('click',e=>{
  const chip=e.target.closest('.chip');
  if(chip&&chip.closest('.chips')){
    const g=chip.closest('.chips');
    if(g.dataset.multi)chip.classList.toggle('on');
    else{g.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));chip.classList.add('on')}
    if(g.dataset.fill){const inp=document.querySelector(`[name="${g.dataset.fill}"]`);if(inp)inp.value=chip.dataset.chip}
    return;
  }
  const t=e.target.closest('[data-act]');if(!t)return;
  const f=A[t.dataset.act];if(f)f(t.dataset,t);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

render();
initSync();
</script>
</body>
</html>
